<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NP2 Protocol Explorer</title>
<meta name="np2-token" content="__NP2_TOKEN__">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: instrument-panel shell. Fixed index rail on the left, one protocol "readout" on the right. */
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --ink: #16191f;
  --muted: #5d6573;
  --line: #dde1e7;
  --nir: #c2362b;          /* 810 nm accent: the device's own deep red */
  --nir-soft: #f7e3e0;
  --phase-a: #1f7a8c;
  --phase-b: #b7791f;
  --delta: #5b4bb3; --theta: #2f6fd0; --alpha: #1f8a6b; --beta: #b8860b; --gamma: #c2362b; --high: #8a3f8f;
  --off: #c9ced6;
  --ok: #1f8a4c; --ok-soft: #e3f3e9; --warn: #b7791f; --bad: #c0392b; --bad-soft: #fbe6e3;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --ink: #e7eaef; --muted: #9aa3b2; --line: #2a303a;
    --nir: #ff6b5c; --nir-soft: #3a1d1a; --phase-a: #4fb3c6; --phase-b: #e0a84a;
    --delta: #9a8cf0; --theta: #6ea2f2; --alpha: #4cc29a; --beta: #e2b440; --gamma: #ff6b5c; --high: #cf7fd4;
    --off: #3a414c; color-scheme: dark;
    --ok: #4cc27a; --ok-soft: #16301f; --warn: #e0a84a; --bad: #ff6b5c; --bad-soft: #3a1d1a;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --ink: #e7eaef; --muted: #9aa3b2; --line: #2a303a;
  --nir: #ff6b5c; --nir-soft: #3a1d1a; --phase-a: #4fb3c6; --phase-b: #e0a84a;
  --delta: #9a8cf0; --theta: #6ea2f2; --alpha: #4cc29a; --beta: #e2b440; --gamma: #ff6b5c; --high: #cf7fd4;
  --off: #3a414c; color-scheme: dark;
  --ok: #4cc27a; --ok-soft: #16301f; --warn: #e0a84a; --bad: #ff6b5c; --bad-soft: #3a1d1a;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--nir); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.topbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
.topbar .brand-mini { font: 700 20px/1 var(--font-display); margin-right: auto; }
.topbar .brand-mini span { color: var(--nir); }
.topbar .brand-mini .ver { color: var(--muted); font: 500 12px/1 var(--font-display); letter-spacing: .02em; margin-left: 6px; }
.conn { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; white-space: nowrap; background: var(--bg); }
.chip b { font-family: var(--font-display); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; color: var(--muted); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
button.chip { font: inherit; font-size: 12.5px; color: inherit; cursor: pointer; }
button.chip:hover { border-color: var(--ink); }
button.chip:disabled { cursor: progress; opacity: .75; }
.toast { position: fixed; right: 18px; bottom: 18px; max-width: 520px; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.15); font-size: 13.5px; }
.toast[hidden] { display: none; }
table.imp { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 10px; }
table.imp th { text-align: left; font: 600 11.5px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.imp td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.imp input { border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; background: var(--bg); width: 100%; box-sizing: border-box; }
table.imp.fixed { table-layout: fixed; }
table.imp.fixed td, table.bk td { white-space: normal; overflow-wrap: anywhere; }
.imp-issue { display: flex; gap: 6px; align-items: baseline; }
.imp-issue .flag { margin: 0; flex: none; }
.imp-stages .flag { margin: 0 5px 0 0; }
table.bk .bk-list { color: var(--muted); font-size: 12.5px; }
table.imp tr.imp-grp td { font-size: 12.5px; color: var(--muted); background: var(--bg); padding: 6px 8px; }
.imp-sum { margin: 10px 0 0; }
.imp-tag { display: inline-block; font: 600 12px/1.6 var(--font-display); letter-spacing: .04em; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); }
.imp-tag.new { color: var(--ok); border-color: var(--ok); }
.imp-tag.ok { color: var(--ok); border-color: var(--ok); }
.imp-tag.same { color: var(--muted); }
.imp-tag.bad { color: var(--bad); border-color: var(--bad); }
.imp-issue { font-size: 12.5px; margin-top: 4px; }
.imp-issue.bad { color: var(--bad); }
ol.imp-stages { margin: 4px 0 0; padding-left: 20px; }
.toast.bad { border-color: var(--bad); }
.chip.ok .dot { background: var(--ok); } .chip.warn .dot { background: var(--warn); } .chip.bad .dot { background: var(--bad); }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.bars i { width: 3px; background: var(--off); border-radius: 1px; }
.bars i.on { background: var(--ok); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 13px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--nir); border-color: var(--nir); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 16px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font: 600 11.5px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.field input, .field select, .field textarea, td input, td select { border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; background: var(--bg); min-width: 0; }
.field textarea { resize: vertical; min-height: 54px; font: inherit; }
td input[type=number] { width: 72px; font-family: var(--font-data); font-size: 12.5px; }
td select { font-size: 12.5px; }
.hint { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg label { padding: 6px 12px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--line); }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--panel); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--nir); outline-offset: -2px; }
.errors { border-left: 3px solid var(--bad); background: var(--bad-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 13.5px; }
.errors ul { margin: 4px 0 0; padding-left: 18px; }
.success { border-left: 3px solid var(--ok); background: var(--ok-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; }
.confirm { border: 2px solid var(--nir); border-radius: 10px; padding: 16px 18px; background: var(--panel); }
.confirm ul { margin: 6px 0 12px; padding-left: 20px; }
.stage-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.stage-row select { width: 100%; }
.mono { font-family: var(--font-data); font-size: 12.5px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.rail { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
.brand h1 { font: 700 22px/1.1 var(--font-display); letter-spacing: .01em; margin: 0; }
.brand h1 span { color: var(--nir); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.search { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
.search .refresh { flex: none; width: 38px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; }
.search .refresh:hover:not(:disabled) { border-color: var(--nir); color: var(--nir); }
.search .refresh:disabled { cursor: default; opacity: .7; }
.search .refresh.busy span { display: inline-block; animation: spin .9s linear infinite; }
.spin { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { height: 12px; margin: 10px 0 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
.progress .bar { height: 100%; width: 0; background: var(--nir); border-radius: 6px; transition: width .35s ease; }
.progress.indeterminate .bar { width: 30%; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
.search input { flex: 1; min-width: 0; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.index { overflow-y: auto; padding: 6px 0 24px; flex: 1; }
.group h2 { font: 600 12px/1 var(--font-display); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 18px 18px 6px; }
.item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 18px; cursor: pointer; }
.item:hover { background: var(--bg); }
.item[aria-current="true"] { background: var(--nir-soft); }
.item .name { flex: 1; min-width: 0; font-family: var(--font-data); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { font-family: var(--font-data); font-size: 11px; color: var(--muted); }
.swatch { width: 8px; height: 22px; border-radius: 2px; flex: none; }
.flag { font: 700 13px/1 var(--font-display); margin-left: 4px; cursor: help; }
.flag.bad { color: var(--bad); } .flag.warn { color: var(--warn); }
.issues { border-left: 3px solid var(--bad); background: var(--bad-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 13.5px; margin: 14px 0; }
.issues.warn { border-left-color: var(--warn); background: var(--bg); }
.issues h3 { margin: 0 0 6px; font-size: 15px; }
.issues ul { margin: 0; padding-left: 0; list-style: none; }
.issues li { margin: 4px 0; padding-left: 22px; text-indent: -22px; }
.issues li .flag { display: inline-block; width: 18px; margin: 0; text-indent: 0; }
.oc { font: 600 10.5px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 3px; padding: 2px 5px; white-space: nowrap; }
.oc.ended { color: var(--ok); } .oc.stopped { color: var(--warn); } .oc.failed { color: var(--bad); }
.hstats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 4px 0 6px; }
.hstats div b { display: block; font: 600 20px/1.2 var(--font-data); }
.hstats div span { font: 600 11px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mine-tag { font: 600 10px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--nir); border: 1px solid var(--nir); border-radius: 3px; padding: 2px 4px; }

main { overflow-y: auto; min-width: 0; }
.page { max-width: 1080px; margin: 0 auto; padding: 28px 28px 64px; display: grid; gap: 22px; }
.eyebrow { font: 600 12px/1 var(--font-display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
h2.title { font: 700 40px/1.05 var(--font-display); margin: 6px 0 0; text-wrap: balance; overflow-wrap: anywhere; }
.lede { font-size: 17px; max-width: 68ch; margin: 8px 0 0; color: var(--ink); }
.note-src { color: var(--muted); font-style: italic; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stat { background: var(--panel); padding: 12px 14px; min-width: 0; }
.stat .k { font: 600 11px/1 var(--font-display); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.stat .v { font: 600 20px/1.2 var(--font-data); margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .s { font-size: 12px; color: var(--muted); margin-top: 2px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.card h3 { font: 700 18px/1.2 var(--font-display); margin: 0 0 10px; letter-spacing: .01em; }
.card h4 { font: 600 13px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; }
.card p { margin: 0 0 10px; max-width: 72ch; }
.card ul { margin: 0 0 10px; padding-left: 20px; max-width: 72ch; }
.two { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 22px; align-items: start; }

.headmap svg { width: 100%; max-width: 340px; height: auto; display: block; margin: 0 auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 600 11px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
td.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
tr.off td { color: var(--muted); opacity: .6; }
.pill { display: inline-block; font: 600 11px/1 var(--font-data); padding: 3px 6px; border-radius: 4px; color: #fff; }
.pa { background: var(--phase-a); } .pb { background: var(--phase-b); }

.chart .tl { width: 100%; }
.chart svg { display: block; }
.chart text { fill: var(--muted); font: 11px var(--font-data); }
.chart text.lit { fill: var(--ink); }
.chart text.unit { font: 600 10.5px var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.chart .axis { stroke: var(--line); }

.stages { display: grid; gap: 10px; }
.stage { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--panel); cursor: pointer; text-align: left; width: 100%; }
.stage:hover { border-color: var(--nir); }
.stage .n { font: 700 22px/1 var(--font-display); color: var(--muted); }
.stage .t { font-family: var(--font-data); font-size: 14px; font-weight: 600; }
.stage .d { font-size: 13px; color: var(--muted); }
.stage .dur { font: 600 14px var(--font-data); }
.strip { display: flex; height: 34px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.strip div { min-width: 2px; display: flex; align-items: center; justify-content: center; color: #fff; font: 600 11px var(--font-data); overflow: hidden; white-space: nowrap; }
.callout { border-left: 3px solid var(--nir); background: var(--nir-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; }
.callout p:last-child { margin-bottom: 0; }
.disclaimer { font-size: 12.5px; color: var(--muted); max-width: 80ch; }
.bands { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.band { border-top: 4px solid; padding-top: 8px; }
.band b { font-family: var(--font-display); font-size: 16px; }
.band .r { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.band p { font-size: 13.5px; margin: 4px 0 0; }
.menu-btn { display: none; }
.ctx { position: fixed; z-index: 60; min-width: 200px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 8px 28px rgba(0,0,0,.18); }
.ctx button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-size: 13.5px; }
.ctx button:hover:not(:disabled), .ctx button:focus-visible { background: var(--nir-soft); }
.ctx button:disabled { opacity: .5; cursor: not-allowed; }
.ctx .why { padding: 2px 12px 7px; font-size: 12px; color: var(--muted); max-width: 280px; }

@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); }
  .rail { max-height: 46vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .two { grid-template-columns: 1fr; }
  .page { padding: 20px 16px 48px; }
  h2.title { font-size: 30px; }
}
@media (prefers-reduced-motion: no-preference) {
  .page { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
/* ---------- Polish (1.8): a slightly deeper background, soft shadows and gentle hover feedback ---------- */
:root {
  --bg: #e8ebf0; --line: #d7dce4; --field: #f6f7fa; --hover: #eef1f5;
  --shadow-xs: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow-sm: 0 1px 3px rgba(16, 24, 40, .08), 0 1px 2px rgba(16, 24, 40, .04);
  --shadow-md: 0 8px 18px -6px rgba(16, 24, 40, .16), 0 2px 4px -2px rgba(16, 24, 40, .06);
  --shadow-lg: 0 20px 44px -10px rgba(16, 24, 40, .28);
  --ring: 0 0 0 3px rgba(194, 54, 43, .18);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e12; --panel: #161a21; --line: #272d37; --field: #10141a; --hover: #1e242d;
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, .45), 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-md: 0 10px 22px -6px rgba(0, 0, 0, .6), 0 2px 4px -2px rgba(0, 0, 0, .4);
    --shadow-lg: 0 22px 48px -10px rgba(0, 0, 0, .75);
    --ring: 0 0 0 3px rgba(255, 107, 92, .28);
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e12; --panel: #161a21; --line: #272d37; --field: #10141a; --hover: #1e242d;
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, .35);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, .45), 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-md: 0 10px 22px -6px rgba(0, 0, 0, .6), 0 2px 4px -2px rgba(0, 0, 0, .4);
  --shadow-lg: 0 22px 48px -10px rgba(0, 0, 0, .75);
  --ring: 0 0 0 3px rgba(255, 107, 92, .28);
}
* { scrollbar-width: thin; scrollbar-color: var(--off) transparent; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--nir) !important; box-shadow: var(--ring); }
.card { border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.btn { border-radius: 8px; box-shadow: var(--shadow-xs); transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, background-color .12s ease, filter .12s ease; }
.btn:hover:not([disabled]) { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--muted); }
.btn:active:not([disabled]) { transform: none; box-shadow: var(--shadow-xs); }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--nir) 86%, #fff), var(--nir)); box-shadow: 0 1px 2px rgba(0, 0, 0, .14), inset 0 1px 0 rgba(255, 255, 255, .2); }
.btn.primary:hover:not([disabled]) { border-color: var(--nir); filter: brightness(1.04); box-shadow: 0 8px 18px -6px color-mix(in srgb, var(--nir) 60%, transparent); }
.btn.danger:hover:not([disabled]) { border-color: var(--bad); }
.btn[disabled] { box-shadow: none; }
.topbar { position: relative; z-index: 2; box-shadow: var(--shadow-sm); }
.rail { position: relative; z-index: 1; border-right-color: transparent; box-shadow: 1px 0 0 var(--line), 6px 0 18px -14px rgba(16, 24, 40, .35); }
.chip { background: var(--field); box-shadow: var(--shadow-xs); transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
button.chip:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--muted); }
.search input, .field input, .field select, .field textarea, td input, td select, table.imp input { background: var(--field); transition: border-color .12s ease, box-shadow .12s ease; }
.search .refresh { border-radius: 8px; box-shadow: var(--shadow-xs); transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, color .12s ease; }
.search .refresh:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.item { width: calc(100% - 16px); margin: 1px 8px; padding: 6px 10px; border-radius: 8px; transition: background-color .12s ease, box-shadow .12s ease; }
.item:hover { background: var(--hover); }
.item[aria-current="true"] { background: var(--nir-soft); box-shadow: inset 3px 0 0 var(--nir); }
.stats { border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.stage { border-radius: 10px; box-shadow: var(--shadow-xs); transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
.stage:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.strip { border-radius: 8px; box-shadow: var(--shadow-xs); }
.seg { border-radius: 8px; box-shadow: var(--shadow-xs); }
.seg label { transition: background-color .12s ease; }
.seg label:hover:not(:has(input:checked)) { background: var(--hover); }
.callout, .errors, .success, .issues { border-radius: 0 10px 10px 0; }
.confirm { border-radius: var(--radius); box-shadow: var(--shadow-md); }
.tablewrap tbody tr td, table.imp tbody tr td { transition: background-color .1s ease; }
.tablewrap tbody tr:hover td, table.imp tbody tr:hover td { background: var(--hover); }
.toast { border-radius: 12px; box-shadow: var(--shadow-lg); }
.ctx { border-radius: 10px; box-shadow: var(--shadow-lg); }
.ctx button { border-radius: 6px; transition: background-color .1s ease; }
@media (prefers-reduced-motion: no-preference) {
  .toast:not([hidden]) { animation: toast-in .22s ease-out; }
  @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
}
/* Busy chip: orange dots chase each other around the pill's outline. */
.chip.busy { position: relative; overflow: visible; border-color: color-mix(in srgb, var(--snake) 45%, var(--line)); }
.chip.busy .dot { background: var(--snake); }
.chip .snake { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.chip .snake rect { x: 3px; y: 3px; width: calc(100% - 6px); height: calc(100% - 6px); rx: 10px; ry: 10px;
  fill: none; stroke: var(--snake); stroke-linecap: round; stroke-dasharray: 0 100; animation: snake 3.2s linear infinite; }
@keyframes snake { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
:root { --snake: #f28a1e; }
@media (prefers-reduced-motion: reduce) {
  .chip .snake { display: none; }
  .chip.busy { border-color: var(--snake); }
  .btn, button.chip, .chip, .stage, .search .refresh, .item { transition: none; }
  .btn:hover:not([disabled]), button.chip:hover:not(:disabled), .stage:hover, .search .refresh:hover:not(:disabled) { transform: none; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand-mini">NP2 <span>Protocol</span> Explorer<small class="ver">v. 1.9.8</small></div>
    <div class="conn" id="conn" aria-live="polite"></div>
    <div class="actions" id="create"></div>
  </header>
  <aside class="rail">
    <div class="search"><input id="q" type="search" placeholder="Filter files (e.g. 40Hz, sweep, LS)" aria-label="Filter files"><button class="refresh" id="refresh" type="button" title="Reload every file from the NP2" aria-label="Refresh the file list from the NP2"><span>↻</span></button></div>
    <nav class="index" id="index"></nav>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="ctx" id="ctx" role="menu" hidden></div>

<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
